<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kebun belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#CDEBFF;--card:#fff;--ink:#25214F;--yel:#FFC933;--pur:#7656FF;--hill:#8FDDA8;--ok:#2FB36D;--no:#FF4D4D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#18163D;--card:#2B2862;--ink:#F4F1FF;--hill:#1E6B49}}
:root[data-theme="dark"]{--sky:#18163D;--card:#2B2862;--ink:#F4F1FF;--hill:#1E6B49}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font:800 14px/1.3 Nunito,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--pur);outline-offset:3px}
.app{position:relative;max-width:390px;min-height:100vh;margin:0 auto;padding:18px 20px 170px;overflow:hidden;display:flex;flex-direction:column}
.hill{position:fixed;left:50%;bottom:-60px;width:min(560px,150vw);height:130px;transform:translateX(-50%);pointer-events:none;z-index:0;background:
radial-gradient(ellipse 34% 100% at 20% 100%,var(--hill) 98%,transparent 100%),radial-gradient(ellipse 40% 100% at 52% 100%,var(--hill) 98%,transparent 100%),radial-gradient(ellipse 34% 100% at 84% 100%,var(--hill) 98%,transparent 100%)}
.hill::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--hill)}
.app>*{position:relative;z-index:1}
.sk{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.sk:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
h1,h2,.bd{font-family:"Baloo 2",sans-serif;font-weight:800;margin:0}
.t1{font-size:34px;text-align:center;line-height:1.1}
.sub{text-align:center;margin:2px 0 6px;font-size:15px}
.hero{display:block;width:min(290px,78%);margin:8px auto 10px;animation:hop .8s ease-out}
@keyframes hop{0%{transform:translateY(24px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
.lbl{font:800 17px "Baloo 2";margin:10px 0 10px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;margin-bottom:14px;text-align:left}
.tile{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;flex:none;font:800 34px/1 "Baloo 2";color:#25214F}
.tile img{width:34px}
.mi div b{display:block;font:800 19px/1.1 "Baloo 2"}.mi div span{font-size:12.5px;font-weight:700}
.mi i{margin-left:auto;font:800 24px "Baloo 2";font-style:normal}
.foot{text-align:center;font-size:13px;margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:40px;height:40px;padding:0;border-radius:13px;font:800 26px/1 "Baloo 2";flex:none;display:grid;place-items:center;padding-bottom:3px}
.bar b{font:800 17px "Baloo 2"}.bar span{margin-left:auto;font-size:13px}
.prog{height:16px;border:3px solid var(--ink);border-radius:9px;background:var(--card);overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;background:var(--pur);border-radius:6px;transition:width .4s}
h2.q{font-size:23px;text-align:center;margin-bottom:18px}
.card{min-height:262px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;cursor:pointer}
.fr{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:100%;max-width:312px}
.fr img{flex:0 0 calc((100% - 12px)/5);max-width:60px;min-width:0;height:auto}
.fr.k img{max-width:56px}
.fr.t{width:108px;max-width:108px}.fr.t img{flex:0 0 calc((100% - 6px)/3)}
.eq{font:800 42px/1 "Baloo 2";letter-spacing:.01em;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.row i{font:800 22px "Baloo 2";font-style:normal;flex:none}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans button{height:94px;font:800 42px/1 "Baloo 2";border-radius:20px;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:background .12s,color .12s,transform .08s,box-shadow .08s}
.ans button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ans .ok{background:var(--ok);color:#fff}.ans .no{background:var(--no);color:#fff}
.win{display:block;width:min(260px,70%);margin:6px auto 0;animation:hop .8s ease-out}
.rs h1{font-size:44px;text-align:center;margin:10px 0 4px}.rs p{text-align:center;font-size:18px;margin:0 0 30px}
.btn{display:block;width:100%;padding:13px;margin-bottom:14px;text-align:center;font:800 21px "Baloo 2"}
.y{background:var(--yel);color:#25214F}
.spk{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9;padding:5px 11px;font:800 12px "Baloo 2";border-radius:12px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="hill" aria-hidden="true"></div>
<div class="app" id="app"></div>
<button class="sk spk" id="snd" aria-pressed="true">🔊 Suara</button>

const $=s=>document.querySelector(s);
let sound=true,ac;
function tone(f,d=.15,t='sine',s=0){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),st=ac.currentTime+s;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.2,st);g.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+d);}catch(e){}}
const sfx={tap(){tone(700,.07,'square')},ok(){[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',i*.08))},no(){tone(170,.28,'sawtooth')},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',i*.13))}};
function say(t){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
$('#snd').onclick=e=>{sound=!sound;e.currentTarget.setAttribute('aria-pressed',sound);e.currentTarget.textContent=sound?'🔊 Suara':'🔇 Hening';if(!sound&&window.speechSynthesis)speechSynthesis.cancel();};

const M={
 hitung:{t:'Hitung buah',h:'Ada berapa buah?',d:[['apel',3,[3,2,4]],['pisang',5,[4,6,5]],['jeruk',2,[1,2,3]],['stroberi',7,[6,8,7]],['apel',4,[4,3,5]],['pisang',9,[8,9,10]],['jeruk',6,[6,5,7]],['stroberi',10,[9,11,10]]]},
 tambah:{t:'Tambah',h:'Berapa jumlahnya?',d:[['apel',1,2,[2,3,4]],['pisang',2,2,[4,3,5]],['jeruk',2,3,[4,6,5]],['stroberi',3,3,[5,6,7]],['apel',4,3,[6,8,7]],['pisang',4,4,[8,7,9]],['jeruk',5,4,[8,10,9]],['stroberi',5,5,[9,10,11]]]},
 kurang:{t:'Kurang',h:'Berapa sisanya?',d:[['apel',4,1,[2,4,3]],['pisang',5,2,[2,3,4]],['jeruk',6,3,[3,2,4]],['stroberi',7,3,[3,4,5]],['apel',8,2,[5,7,6]],['pisang',9,4,[5,4,6]],['jeruk',10,3,[6,7,8]],['stroberi',10,5,[4,6,5]]]}
};
const S={scr:'home',m:'',i:0,lock:false};
const im=(f,x)=>`<img src="${IMG[f+(x?'_x':'')]}" alt="${f}" draggable="false">`;
const fr=(f,n,cls='',cross=0)=>`<div class="fr ${cls}">${Array.from({length:n},(_,i)=>im(f,i>=n-cross)).join('')}</div>`;

function home(){return `<h1 class="t1">Kebun belajar</h1><p class="sub">Yuk, bermain dengan angka.</p>
<img class="hero" src="${HERO}" alt="Hoo si burung hantu"><div class="lbl">Pilih permainan</div>
<button class="sk mi" data-a="play" data-v="hitung"><span class="tile" style="background:var(--yel)"><img src="${IMG.apel}" alt=""></span><div><b>Hitung buah</b><span>Ayo, hitung satu-satu</span></div><i>›</i></button>
<button class="sk mi" data-a="play" data-v="tambah"><span class="tile" style="background:#FF5C93">+</span><div><b>Tambah</b><span>Gabungkan buahnya</span></div><i>›</i></button>
<button class="sk mi" data-a="play" data-v="kurang"><span class="tile" style="background:#8FDDA8">−</span><div><b>Kurang</b><span>Berapa yang tersisa?</span></div><i>›</i></button>
<p class="foot">Belajar seru bersama Hoo</p>`;}

function question(){
  const m=M[S.m],d=m.d[S.i],f=d[0];let card,opts;
  if(S.m==='hitung'){card=fr(f,d[1]);opts=d[2];}
  else if(S.m==='tambah'){card=`<div class="eq">${d[1]} + ${d[2]} = ?</div><div class="row">${fr(f,d[1],'t')}<i>+</i>${fr(f,d[2],'t')}</div>`;opts=d[3];}
  else{card=`<div class="eq">${d[1]} − ${d[2]} = ?</div>${fr(f,d[1],'k',d[2])}`;opts=d[3];}
  return `<div class="bar"><button class="sk back" data-a="home" aria-label="Kembali ke menu">‹</button><b>${m.t}</b><span>${S.i+1} dari 8</span></div>
<div class="prog"><i style="width:${(S.i+1)/8*100}%"></i></div><h2 class="q">${m.h}</h2>
<div class="sk card" data-a="say" role="img" aria-label="${qtext()}">${card}</div>
<div class="ans">${opts.map(n=>`<button data-a="pick" data-v="${n}">${n}</button>`).join('')}</div>`;
}
function correct(){const d=M[S.m].d[S.i];return S.m==='hitung'?d[1]:S.m==='tambah'?d[1]+d[2]:d[1]-d[2];}
function qtext(){const d=M[S.m].d[S.i];return S.m==='hitung'?'Ada berapa buah?':S.m==='tambah'?`${d[1]} tambah ${d[2]} sama dengan berapa?`:`${d[1]} kurang ${d[2]} sama dengan berapa?`;}
function result(){return `<img class="win" src="${WIN}" alt="Hoo dan tiga bintang"><div class="rs"><h1>Hebat!</h1><p>8 soal selesai!</p>
<button class="sk btn y" data-a="again">Main lagi</button><button class="sk btn" data-a="home">Menu</button></div>`;}

function draw(){$('#app').innerHTML={home,question,result}[S.scr]();window.scrollTo(0,0);S.lock=false;}
function go(scr,o={}){Object.assign(S,{scr},o);draw();
  if(scr==='home')say('Pilih permainan');
  if(scr==='question')say(qtext());
  if(scr==='result'){sfx.win();say('Hebat! 8 soal selesai!');}}
$('#app').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='play'){sfx.tap();go('question',{m:v,i:0});}
  else if(a==='again'){sfx.tap();go('question',{i:0});}
  else if(a==='home'){sfx.tap();go('home');}
  else if(a==='say')say(qtext());
  else if(a==='pick'){
    if(S.lock)return;const n=+v;
    if(n===correct()){
      S.lock=true;b.classList.add('ok');sfx.ok();say(`${n}. Benar!`);
      setTimeout(()=>{if(S.i===7)go('result');else go('question',{i:S.i+1});},700);
    }else{
      b.classList.add('no');sfx.no();say('Coba lagi');
      setTimeout(()=>b.classList.remove('no'),600);
    }
  }
};
draw();
</script>
